# Netlify configuration — repo root.
# The Astro project lives in molecular-meteorite/, so "Import from GitHub" needs
# no manual settings: base, build command and publish dir are all declared here.

[build]
  base    = "molecular-meteorite"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Forms — detected automatically from data-netlify="true" on the contact form.
# After the first deploy: Site → Forms → "contact" → Notifications → add Manuela's email.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
