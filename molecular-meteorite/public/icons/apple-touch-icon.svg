<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Background: deep-forest circle -->
  <rect width="180" height="180" rx="36" fill="#2C4A3E"/>
  <!-- Bougainvillea mark — 6 bracts around center -->
  <g transform="translate(90,90)">
    <!-- Back layer bracts -->
    <ellipse rx="10" ry="26" fill="#D4929A" transform="rotate(30)" opacity="0.8" cy="-22"/>
    <ellipse rx="10" ry="26" fill="#D4929A" transform="rotate(150)" opacity="0.8" cy="-22"/>
    <ellipse rx="10" ry="26" fill="#D4929A" transform="rotate(270)" opacity="0.8" cy="-22"/>
    <!-- Front layer bracts -->
    <ellipse rx="10" ry="26" fill="#E8B4B8" transform="rotate(90)" cy="-22"/>
    <ellipse rx="10" ry="26" fill="#E8B4B8" transform="rotate(210)" cy="-22"/>
    <ellipse rx="10" ry="26" fill="#E8B4B8" transform="rotate(330)" cy="-22"/>
    <!-- Center -->
    <circle r="10" fill="#FAF6EF"/>
    <circle r="5" fill="#C9A96E"/>
  </g>
  <!-- ⚠ Replace with official 180×180 PNG before launch -->
</svg>
